syntax = "proto3";

package oteldemo;

option go_package = "genproto/oteldemo";

// -----------------Cart service-----------------

service CartService {
    rpc AddItem(AddItemRequest) returns (Empty) {}
    rpc GetCart(GetCartRequest) returns (Cart) {}
    rpc EmptyCart(EmptyCartRequest) returns (Empty) {}
}

message CartItem {
    string product_id = 1;
    int32  quantity = 2;
}

message AddItemRequest {
    string user_id = 1;
    CartItem item = 2;
}

message EmptyCartRequest {
    string user_id = 1;
}

message GetCartRequest {
    string user_id = 1;
}

message Cart {
    string user_id = 1;
    repeated CartItem items = 2;
}

message Empty {}

// ---------------Recommendation service----------

service RecommendationService {
  rpc ListRecommendations(ListRecommendationsRequest) returns (ListRecommendationsResponse){}
}

message ListRecommendationsRequest {
    string user_id = 1;
    repeated string product_ids = 2;
}

message ListRecommendationsResponse {
    repeated string product_ids = 1;
}

// ---------------Product Catalog----------------

service ProductCatalogService {
    rpc ListProducts(Empty) returns (ListProductsResponse) {}
    rpc GetProduct(GetProductRequest) returns (Product) {}
    rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse) {}
}

message Product {
    string id = 1;
    string name = 2;
    string description = 3;
    string picture = 4;
    Money price_usd = 5;

    // Categories such as "clothing" or "kitchen" that can be used to look up
    // other related products.
    repeated string categories = 6;
}

message ListProductsResponse {
    repeated Product products = 1;
}

message GetProductRequest {
    string id = 1;
}

message SearchProductsRequest {
    string query = 1;
}

message SearchProductsResponse {
    repeated Product results = 1;
}

// ---------------Product Review service----------

service ProductReviewService {
  rpc GetProductReviews(GetProductReviewsRequest) returns (GetProductReviewsResponse){}
  rpc GetAverageProductReviewScore(GetAverageProductReviewScoreRequest) returns (GetAverageProductReviewScoreResponse){}
  rpc AskProductAIAssistant(AskProductAIAssistantRequest) returns (AskProductAIAssistantResponse){}
}

message ProductReview {
    string username = 1;
    string description = 2;
    string score = 3;
}

message GetProductReviewsRequest {
    string product_id = 1;
}

message GetProductReviewsResponse {
    repeated ProductReview product_reviews = 1;
}

message GetAverageProductReviewScoreRequest {
    string product_id = 1;
}

message GetAverageProductReviewScoreResponse {
    string average_score = 1;
}

message AskProductAIAssistantRequest {
    string product_id = 1;
    string question = 2;
}

message AskProductAIAssistantResponse {
    string response = 1;
}

// ---------------Shipping Service----------

service ShippingService {
    rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {}
    rpc ShipOrder(ShipOrderRequest) returns (ShipOrderResponse) {}
}

message GetQuoteRequest {
    Address address = 1;
    repeated CartItem items = 2;
}

message GetQuoteResponse {
    Money cost_usd = 1;
}

message ShipOrderRequest {
    Address address = 1;
    repeated CartItem items = 2;
}

message ShipOrderResponse {
    string tracking_id = 1;
}

message Address {
    string street_address = 1;
    string city = 2;
    string state = 3;
    string country = 4;
    string zip_code = 5;
}

// -----------------Currency service-----------------

service CurrencyService {
    rpc GetSupportedCurrencies(Empty) returns (GetSupportedCurrenciesResponse) {}
    rpc Convert(CurrencyConversionRequest) returns (Money) {}
}

// Represents an amount of money with its currency type.
message Money {
    // The 3-letter currency code defined in ISO 4217.
    string currency_code = 1;

    // The whole units of the amount.
    // For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
    int64 units = 2;

    // Number of nano (10^-9) units of the amount.
    // The value must be between -999,999,999 and +999,999,999 inclusive.
    // If `units` is positive, `nanos` must be positive or zero.
    // If `units` is zero, `nanos` can be positive, zero, or negative.
    // If `units` is negative, `nanos` must be negative or zero.
    // For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
    int32 nanos = 3;
}

message GetSupportedCurrenciesResponse {
    // The 3-letter currency code defined in ISO 4217.
    repeated string currency_codes = 1;
}

message CurrencyConversionRequest {
    Money from = 1;

    // The 3-letter currency code defined in ISO 4217.
    string to_code = 2;
}

// -------------Payment service-----------------

service PaymentService {
    rpc Charge(ChargeRequest) returns (ChargeResponse) {}
}

message CreditCardInfo {
    string credit_card_number = 1;
    int32 credit_card_cvv = 2;
    int32 credit_card_expiration_year = 3;
    int32 credit_card_expiration_month = 4;
}

message ChargeRequest {
    Money amount = 1;
    CreditCardInfo credit_card = 2;
}

message ChargeResponse {
    string transaction_id = 1;
}

// -------------Email service-----------------

service EmailService {
    rpc SendOrderConfirmation(SendOrderConfirmationRequest) returns (Empty) {}
}

message OrderItem {
    CartItem item = 1;
    Money cost = 2;
}

message OrderResult {
    string   order_id = 1;
    string   shipping_tracking_id = 2;
    Money shipping_cost = 3;
    Address  shipping_address = 4;
    repeated OrderItem items = 5;
}

message SendOrderConfirmationRequest {
    string email = 1;
    OrderResult order = 2;
}


// -------------Checkout service-----------------

service CheckoutService {
    rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse) {}
}

message PlaceOrderRequest {
    string user_id = 1;
    string user_currency = 2;

    Address address = 3;
    string email = 5;
    CreditCardInfo credit_card = 6;
}

message PlaceOrderResponse {
    OrderResult order = 1;
}

// ------------Ad service------------------

service AdService {
    rpc GetAds(AdRequest) returns (AdResponse) {}
}

message AdRequest {
    // List of important key words from the current page describing the context.
    repeated string context_keys = 1;
}

message AdResponse {
    repeated Ad ads = 1;
}

message Ad {
    // url to redirect to when an ad is clicked.
    string redirect_url = 1;

    // short advertisement text to display.
    string text = 2;
}

// ------------Feature flag service------------------

service FeatureFlagService {
  rpc GetFlag(GetFlagRequest) returns (GetFlagResponse) {}
  rpc CreateFlag(CreateFlagRequest) returns (CreateFlagResponse) {}
  rpc UpdateFlag(UpdateFlagRequest) returns (UpdateFlagResponse) {}
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse) {}
  rpc DeleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse) {}
}

message Flag {
  string name = 1;
  string description = 2;
  bool enabled = 3;
}

message GetFlagRequest {
  string name = 1;
}

message GetFlagResponse {
  Flag flag = 1;
}

message CreateFlagRequest {
  string name = 1;
  string description = 2;
  bool enabled = 3;
}

message CreateFlagResponse {
  Flag flag = 1;
}

message UpdateFlagRequest {
  string name = 1;
  bool enabled = 2;
}

message UpdateFlagResponse {}

message ListFlagsRequest {}

message ListFlagsResponse {
  repeated Flag flag = 1;
}

message DeleteFlagRequest {
  string name = 1;
}

message DeleteFlagResponse {}

// ------------Inventory service------------------

service InventoryService {
    // Reserve stock for an order — decrements available count
    rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse) {}

    // Release a previous reservation (order cancelled/timed out)
    rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse) {}

    // Check current stock level for a product
    rpc GetStockLevel(GetStockLevelRequest) returns (GetStockLevelResponse) {}

    // Batch check stock levels
    rpc BatchGetStockLevels(BatchGetStockLevelRequest) returns (BatchGetStockLevelResponse) {}
}

message StockItem {
    string product_id = 1;
    int32 quantity = 2;
}

message ReserveStockRequest {
    string order_id = 1;
    repeated StockItem items = 2;
}

message StockItemStatus {
    string product_id = 1;
    bool available = 2;
    int32 available_quantity = 3;
    int32 requested_quantity = 4;
}

message ReserveStockResponse {
    bool success = 1;
    string reservation_id = 2;
    repeated StockItemStatus item_statuses = 3;
}

message ReleaseStockRequest {
    string reservation_id = 1;
}

message ReleaseStockResponse {
    bool success = 1;
}

message GetStockLevelRequest {
    string product_id = 1;
}

message GetStockLevelResponse {
    string product_id = 1;
    int32 available = 2;
    int32 reserved = 3;
}

message BatchGetStockLevelRequest {
    repeated string product_ids = 1;
}

message BatchGetStockLevelResponse {
    repeated GetStockLevelResponse levels = 1;
}

// ------------Review service------------------

service ReviewService {
    // Submit a new review
    rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse) {}

    // List reviews for a product
    rpc ListProductReviews(ListProductReviewsRequest) returns (ListProductReviewsResponse) {}

    // Get average rating for a product
    rpc GetRating(GetRatingRequest) returns (GetRatingResponse) {}
}

message SubmitReviewRequest {
    string product_id = 1;
    string user_id = 2;
    int32 rating = 3;        // 1-5 stars
    string title = 4;
    string body = 5;
}

message SubmitReviewResponse {
    string review_id = 1;
    bool success = 2;
}

message ListProductReviewsRequest {
    string product_id = 1;
    int32 limit = 2;          // max reviews to return, default 10
}

message ReviewItem {
    string review_id = 1;
    string product_id = 2;
    string user_id = 3;
    string user_display_name = 4;
    int32 rating = 5;
    string title = 6;
    string body = 7;
    int64 created_at = 8;
}

message ListProductReviewsResponse {
    repeated ReviewItem reviews = 1;
    double average_rating = 2;
    int32 total_count = 3;
}

message GetRatingRequest {
    string product_id = 1;
}

message GetRatingResponse {
    string product_id = 1;
    double average_rating = 2;
    int32 review_count = 3;
}

// ------------Notification service------------------

service NotificationService {
    // Send a notification across configured channels
    rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse) {}

    // Check delivery status of a notification
    rpc GetNotificationStatus(GetNotificationStatusRequest) returns (GetNotificationStatusResponse) {}
}

enum NotificationType {
    ORDER_CONFIRMATION = 0;
    SHIPPING_UPDATE = 1;
    PROMOTIONAL = 2;
    REVIEW_REQUEST = 3;
}

enum NotificationChannel {
    EMAIL = 0;
    SMS = 1;
    WEBHOOK = 2;
    PUSH = 3;
}

message SendNotificationRequest {
    string user_id = 1;
    string order_id = 2;
    NotificationType type = 3;
    string subject = 4;
    string body = 5;
    repeated NotificationChannel channels = 6;
}

message SendNotificationResponse {
    string notification_id = 1;
    bool accepted = 2;  // NOT "delivered" — just "accepted for dispatch"
}

message GetNotificationStatusRequest {
    string notification_id = 1;
}

message NotificationChannelStatus {
    NotificationChannel channel = 1;
    string status = 2;  // "pending", "delivered", "failed"
    string error_message = 3;
}

message GetNotificationStatusResponse {
    string notification_id = 1;
    repeated NotificationChannelStatus channel_statuses = 2;
}

// ---------------Search Service----------------

service SearchService {
    rpc SearchProducts(SearchRequest) returns (SearchResponse) {}
    rpc GetSuggestions(SuggestionsRequest) returns (SuggestionsResponse) {}
}

message SearchRequest {
    string query = 1;
    int32 max_results = 2;
    string category_filter = 3;
    string sort_by = 4;  // "relevance", "price_asc", "price_desc", "rating"
}

message SearchResultItem {
    string product_id = 1;
    string name = 2;
    double relevance_score = 3;
    Money price = 4;
}

message SearchResponse {
    repeated SearchResultItem results = 1;
    int32 total_matches = 2;
    double search_duration_ms = 3;
}

message SuggestionsRequest {
    string partial_query = 1;
    int32 max_suggestions = 2;
}

message SuggestionsResponse {
    repeated string suggestions = 1;
}

// ---------------User Service----------------

service UserService {
    rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse) {}
    rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse) {}
    rpc GetUserAddress(GetUserAddressRequest) returns (GetUserAddressResponse) {}
}

message GetUserProfileRequest {
    string user_id = 1;
}

message UserProfile {
    string user_id = 1;
    string display_name = 2;
    string email = 3;
    string avatar_url = 4;
    string preferred_currency = 5;
    string preferred_language = 6;
    int64 created_at = 7;
}

message GetUserProfileResponse {
    UserProfile profile = 1;
}

message UpdatePreferencesRequest {
    string user_id = 1;
    string preferred_currency = 2;
    string preferred_language = 3;
}

message UpdatePreferencesResponse {
    bool success = 1;
}

message GetUserAddressRequest {
    string user_id = 1;
}

message GetUserAddressResponse {
    string street = 1;
    string city = 2;
    string state = 3;
    string zip = 4;
    string country = 5;
}

// ---------------Order Service----------------

service OrderService {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {}
    rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {}
    rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {}
}

message CreateOrderRequest {
    string user_id = 1;
    string cart_id = 2;
    string currency_code = 3;
    Address shipping_address = 4;
    CreditCardInfo credit_card = 5;
}

message CreateOrderResponse {
    string order_id = 1;
    string status = 2;         // "completed", "failed"
    string failure_stage = 3;   // which stage failed, if any
    string error_message = 4;
}

message GetOrderRequest {
    string order_id = 1;
}

message OrderStatus {
    string order_id = 1;
    string status = 2;
    string stage = 3;
    int64 created_at = 4;
}

message GetOrderResponse {
    OrderStatus order = 1;
}

message CancelOrderRequest {
    string order_id = 1;
}

message CancelOrderResponse {
    bool success = 1;
}

// ------------Pricing service------------------

service PricingService {
    rpc GetProductPrice(GetProductPriceRequest) returns (GetProductPriceResponse);
    rpc GetBulkPrices(GetBulkPricesRequest) returns (GetBulkPricesResponse);
    rpc CalculateDiscount(CalculateDiscountRequest) returns (CalculateDiscountResponse);
}

message GetProductPriceRequest {
    string product_id = 1;
    string currency_code = 2;
    int32 quantity = 3;
}

message ProductPrice {
    string product_id = 1;
    Money base_price = 2;
    Money discounted_price = 3;
    double discount_percent = 4;
    string currency_code = 5;
}

message GetProductPriceResponse {
    ProductPrice price = 1;
}

message GetBulkPricesRequest {
    repeated string product_ids = 1;
    string currency_code = 2;
}

message GetBulkPricesResponse {
    repeated ProductPrice prices = 1;
}

message CalculateDiscountRequest {
    repeated CartItem items = 1;
    string promo_code = 2;
}

message CalculateDiscountResponse {
    Money total_before_discount = 1;
    Money total_after_discount = 2;
    double discount_percent = 3;
}
