name: Build Checkout Service

on:
  push:
    branches: [main]
    paths:
      - 'src/checkoutservice/**'
      - 'pb/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-go-service.yaml
    with:
      service_name: checkoutservice
      service_path: src/checkoutservice
    permissions:
      contents: write
      packages: write

  update-kustomize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kustomize overlay
        run: |
          cd k8s/overlays/demo
          # Check if images section exists, add checkoutservice image
          if ! grep -q "newName:.*checkoutservice" kustomization.yaml; then
            echo "  - name: ghcr.io/open-telemetry/demo/checkoutservice" >> kustomization.yaml
            echo "    newName: ghcr.io/${{ github.repository_owner }}/opentelemetry-demo/checkoutservice" >> kustomization.yaml
            echo "    newTag: ${{ needs.build.outputs.image_tag }}" >> kustomization.yaml
          else
            sed -i "s|newTag:.*# checkoutservice|newTag: ${{ needs.build.outputs.image_tag }} # checkoutservice|" kustomization.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/demo/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update checkoutservice image to ${{ needs.build.outputs.image_tag }}"
          git push
