name: Build Currency Service

on:
  push:
    branches: [main]
    paths:
      - 'src/currencyservice/**'
      - 'pb/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/currencyservice/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opentelemetry-demo/currencyservice:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/opentelemetry-demo/currencyservice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-kustomize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kustomize overlay
        run: |
          cd k8s/overlays/demo
          if ! grep -q "newName:.*currencyservice" kustomization.yaml; then
            echo "  - name: ghcr.io/open-telemetry/demo/currencyservice" >> kustomization.yaml
            echo "    newName: ghcr.io/${{ github.repository_owner }}/opentelemetry-demo/currencyservice" >> kustomization.yaml
            echo "    newTag: ${{ needs.build.outputs.image_tag }}" >> kustomization.yaml
          else
            sed -i "s|newTag:.*# currencyservice|newTag: ${{ needs.build.outputs.image_tag }} # currencyservice|" kustomization.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/demo/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update currencyservice image to ${{ needs.build.outputs.image_tag }}"
          git push
