name: Build Ad Service

on:
  push:
    branches: [main]
    paths:
      - 'src/adservice/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opentelemetry-demo/adservice

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/adservice
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update Kustomize overlay
        run: |
          cd k8s/overlays/demo
          # Add image override for adservice
          cat >> kustomization.yaml << PATCH

            - name: ghcr.io/open-telemetry/demo/adservice
              newName: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              newTag: ${{ steps.sha.outputs.short }}
          PATCH

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/demo/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update adservice to ${{ steps.sha.outputs.short }}"
          git push
