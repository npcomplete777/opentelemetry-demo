apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dash0-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dash0hq.github.io/dash0-operator
    chart: dash0-operator
    targetRevision: 0.100.0
    helm:
      valuesObject:
        operator:
          dash0Export:
            enabled: true
            endpoint: ingress.us-west-2.aws.dash0.com:4317
            apiEndpoint: https://api.us-west-2.aws.dash0.com
            secretRef:
              name: dash0-authorization-secret
              key: token
  destination:
    server: https://kubernetes.default.svc
    namespace: dash0-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
