# OBI-only images: every Astronomy Shop service rebuilt from this repo's
# source with ALL OpenTelemetry agents, SDKs and instrumentation libraries
# removed (see src/*). The only telemetry left is what OBI observes.
#
# Images: ghcr.io/npcomplete777/opentelemetry-demo/<svc>:latest, published by
# .github/workflows/build-and-deploy.yaml when src/<svc> changes. On the local
# OrbStack cluster the same names are tagged from local builds
# (docker build ... -t ghcr.io/npcomplete777/opentelemetry-demo/<svc>:latest),
# and IfNotPresent uses them without a registry round-trip.
#
# flagd-ui (Elixir) is not in the CI build map yet, so it uses a locally built
# image (imagePullPolicy: Never) like the obi-showcase services.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
spec:
  template:
    spec:
      containers:
        - name: accounting
          image: 'ghcr.io/npcomplete777/opentelemetry-demo/accounting:latest'
          imagePullPolicy: IfNotPresent
---
