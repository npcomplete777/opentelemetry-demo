# Strategic merge patch to update images and resources for N+1 fix
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  template:
    spec:
      containers:
        - name: checkout
          image: ghcr.io/npcomplete777/opentelemetry-demo/checkoutservice:bed6bfd
          env:
            - name: GOMEMLIMIT
              value: 180MiB
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
spec:
  template:
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/npcomplete777/opentelemetry-demo/productcatalogservice:bed6bfd
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency
spec:
  template:
    spec:
      containers:
        - name: currency
          image: ghcr.io/npcomplete777/opentelemetry-demo/currencyservice:bed6bfd
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
