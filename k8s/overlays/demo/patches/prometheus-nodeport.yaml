apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: otel-demo
spec:
  type: NodePort
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30909
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: otel-demo
