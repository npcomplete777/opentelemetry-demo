# OTEL_SDK_DISABLED=true for every service where it is known to be safe.
#
# This was briefly part of disable-app-sdk.yaml (commit 02deb7fd) and removed
# three minutes later (b1987f0e), but ArgoCD's client-side apply never pruned
# it from the live Deployments: the env entry was not in their
# last-applied-configuration, so the cluster kept running with it while git
# said otherwise and ArgoCD still reported Synced. That live state ran fine
# from 2026-09-24 to 2026-10-01, so it is now codified here instead of
# reverted.
#
# Excluded (see kustomization.yaml target selector):
#   email - Ruby calls meter_provider.add_metric_reader at startup; the
#           disabled stub raises NoMethodError.
#   cart  - .NET NullReferenceException in OpenTelemetryMetricsListener.
#   ad    - never had it live; left as-is.
# Not every SDK honours this flag (Go, Rust and Envoy still try to export),
# which is why the collector's OTLP receiver is also removed.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTEL_SDK_DISABLED
    value: "true"
