apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-agent
  namespace: otel-demo
data:
  relay: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      resource:
        attributes:
          - key: dash0.dataset
            value: astronomy-demo
            action: upsert
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.job.name
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    exporters:
      otlphttp/dash0:
        endpoint: https://ingress.us-west-2.aws.dash0.com
        headers:
          Authorization: "Bearer auth_NmEsw27nOxBxAhBdcPVdXdtkw0hspeeJ"
      clickhouse:
        endpoint: tcp://clickhouse-external:9000
        database: otel
        ttl: 72h
        create_schema: false
        traces_table_name: otel_traces_v2
        logs_table_name: otel_logs
        metrics_table_name: otel_metrics
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
        timeout: 15s
      elasticsearch:
        endpoints:
          - http://elasticsearch-external:9200
        logs_index: otel-logs
        traces_index: otel-traces
        metrics_index: otel-metrics
        mapping:
          mode: ecs
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
        retry:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
      # Vanilla: traces only, OTLP gRPC
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      # Vanilla: logs only, native opensearch exporter format
      opensearch:
        http:
          endpoint: http://opensearch:9200
          tls:
            insecure: true
        logs_index: otel-logs
        logs_index_time_format: yyyy-MM-dd
      # Grafana Stack: Tempo for traces (OTLP HTTP)
      otlphttp/tempo:
        endpoint: http://tempo-external:4318
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
      # Grafana Stack: Mimir for metrics (Prometheus Remote Write)
      prometheusremotewrite/mimir:
        endpoint: http://mimir-external:9009/api/v1/push
        resource_to_telemetry_conversion:
          enabled: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      # Grafana Stack: Loki for logs (OTLP HTTP - Loki 3.x supports native OTLP)
      otlphttp/loki:
        endpoint: http://loki-external:3100/otlp
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
      # Dynatrace: all signals via generic OTLP HTTP exporter
      otlphttp/dynatrace:
        endpoint: https://nxy41179.live.dynatrace.com/api/v2/otlp
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch, resource]
          exporters: [otlphttp/dash0, otlphttp/dynatrace, clickhouse, elasticsearch, otlp/jaeger, otlphttp/tempo, debug]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, batch, resource]
          exporters: [otlphttp/dash0, otlphttp/dynatrace, clickhouse, elasticsearch, prometheusremotewrite/mimir, debug]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch, resource]
          exporters: [otlphttp/dash0, otlphttp/dynatrace, clickhouse, elasticsearch, opensearch, otlphttp/loki, debug]
