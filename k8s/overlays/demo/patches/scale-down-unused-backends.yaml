# OBI-only mode: nothing exports to OpenSearch (the collector's opensearch
# exporter was removed) and Grafana only fronts the bundled backends, which
# no longer receive app telemetry. Scaled to 0 rather than deleted to free
# ~1.7 GiB on the single-node cluster (local image builds share the VM).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-demo
spec:
  replicas: 0
