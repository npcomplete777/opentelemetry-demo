apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: otel-demo
spec:
  template:
    spec:
      containers:
        - name: opentelemetry-collector
          env:
            - name: GOMEMLIMIT
              value: "800MiB"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
