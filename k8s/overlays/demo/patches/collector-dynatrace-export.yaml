apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-agent
  namespace: otel-demo
data:
  relay: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # OBI-only mode: the OTLP receiver (4317/4318) is intentionally removed so
      # any in-process SDK or Envoy tracer that still exports gets
      # connection-refused instead of a successful export. Merely dropping the Dynatrace exporter
      # left OBI tracing those export calls (collector-bound gRPC/HTTP spans).
      # Kafka cluster metrics: brokers, topics, partitions, consumer groups
      kafkametrics:
        brokers:
          - kafka:9092
        protocol_version: "3.0.0"
        collection_interval: 30s
        scrapers:
          - brokers
          - topics
          - consumers
      # Kafka receiver: consume order messages from the demo's orders topic as logs
      kafka/orders:
        brokers:
          - kafka:9092
        protocol_version: "3.0.0"
        group_id: otel-kafka-receiver
        initial_offset: latest
        logs:
          topics:
            - orders
          encoding: raw

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      cumulativetodelta:
      resource:
        attributes:
          - key: dash0.dataset
            value: default
            action: upsert
    exporters:
      otlphttp/prometheus:
        endpoint: http://prometheus:9090/api/v1/otlp
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
      debug:
        verbosity: basic

    # OBI-only mode (2026-10-01): nothing app-side (SDK spans/metrics/logs,
    # Envoy tracing, Kafka scrapes) is forwarded to Dynatrace; OBI exports to
    # Dynatrace directly and bypasses this collector. The Dynatrace exporter,
    # its API-token env var, and the unused Jaeger/OpenSearch exporters,
    # spanmetrics connector and k8sattributes processor were removed. To go
    # back to an SDK+OBI comparison, restore the otlp receiver and an
    # otlphttp exporter (see git history before this change) and point it at
    # your tenant via a Secret, not a committed URL.
    service:
      extensions: [health_check]
      pipelines:
        # Kafka cluster metrics (brokers, topics, partitions, consumer groups)
        metrics/kafka:
          receivers: [kafkametrics]
          processors: [cumulativetodelta, batch, resource]
          exporters: [otlphttp/prometheus, debug]
        # Kafka order messages consumed as logs
        logs/kafka:
          receivers: [kafka/orders]
          processors: [batch, resource]
          exporters: [debug]
