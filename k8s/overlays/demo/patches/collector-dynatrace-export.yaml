apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-agent
  namespace: otel-demo
data:
  relay: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Kafka cluster metrics: brokers, topics, partitions, consumer groups
      kafkametrics:
        brokers:
          - kafka:9092
        protocol_version: "3.0.0"
        collection_interval: 30s
        scrapers:
          - brokers
          - topics
          - consumers
      # Kafka receiver: consume order messages from the demo's orders topic as logs
      kafka/orders:
        brokers:
          - kafka:9092
        protocol_version: "3.0.0"
        group_id: otel-kafka-receiver
        initial_offset: latest
        logs:
          topics:
            - orders
          encoding: raw

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      cumulativetodelta:
      resource:
        attributes:
          - key: dash0.dataset
            value: default
            action: upsert
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.job.name
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 1400ms, 2s, 5s, 10s, 15s]
        dimensions:
          - name: http.request.method
          - name: http.response.status_code
          - name: http.route
          - name: rpc.method
          - name: rpc.service
          - name: rpc.grpc.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_DELTA"
        metrics_flush_interval: 15s

    exporters:
      otlphttp/dynatrace:
        endpoint: https://nxy41179.live.dynatrace.com/api/v2/otlp
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
      otlphttp/prometheus:
        endpoint: http://prometheus:9090/api/v1/otlp
        tls:
          insecure: true
      # Vanilla: traces only, OTLP gRPC
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      # Vanilla: logs only, native opensearch exporter format
      opensearch:
        http:
          endpoint: http://opensearch:9200
          tls:
            insecure: true
        logs_index: otel-logs
        logs_index_time_format: yyyy-MM-dd
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch, resource]
          exporters: [otlphttp/dynatrace, otlp/jaeger, spanmetrics, debug]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [k8sattributes, cumulativetodelta, batch, resource]
          exporters: [otlphttp/dynatrace, otlphttp/prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch, resource]
          exporters: [otlphttp/dynatrace, opensearch, debug]
        # Kafka cluster metrics (brokers, topics, partitions, consumer groups)
        metrics/kafka:
          receivers: [kafkametrics]
          processors: [cumulativetodelta, batch, resource]
          exporters: [otlphttp/dynatrace, otlphttp/prometheus, debug]
        # Kafka order messages consumed as logs
        logs/kafka:
          receivers: [kafka/orders]
          processors: [batch, resource]
          exporters: [otlphttp/dynatrace, debug]
