####################################################################
# Resource limits for ALL demo services — based on observed usage  #
# Requests = ~observed usage, Limits = ~2x headroom                #
####################################################################

# --- Heavy services (>200Mi) ---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  template:
    spec:
      containers:
        - name: load-generator
          resources:
            requests:
              memory: 1Gi
              cpu: 200m
            limits:
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests:
              memory: 512Mi
              cpu: 50m
            limits:
              memory: 768Mi
---
