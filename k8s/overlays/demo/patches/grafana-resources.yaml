apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-demo
spec:
  template:
    spec:
      containers:
        - name: grafana-sc-alerts
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "150Mi"
        - name: grafana-sc-dashboard
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "150Mi"
        - name: grafana-sc-datasources
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "150Mi"
        - name: grafana
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
