apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-demo
resources:
  - ../../base
  # dash0-monitoring.yaml and dash0-views.yaml moved to observability-as-code repo
  # https://github.com/npcomplete777/observability-as-code
  - dash0-secret.yaml
  - dash0-web-proxy.yaml
  - cross-cluster-services.yaml
  - grafana-secret.yaml
  # dynatrace-otel-secret already exists in cluster (created manually to avoid committing tokens)
  # NodePort services - expose observability UIs via k3d node IP
  - patches/grafana-nodeport.yaml
  - patches/jaeger-nodeport.yaml
  - patches/prometheus-nodeport.yaml
  - patches/load-generator-nodeport.yaml
  - patches/flagd-ui-nodeport.yaml
patches:
  - path: patches/collector-dash0-exclude.yaml
  - path: patches/collector-dynatrace-export.yaml
  - path: patches/enable-ad-high-cpu-flag.yaml
  - path: patches/frontend-proxy-nodeport.yaml
  - path: patches/resource-limits.yaml
  - path: patches/frontend-dash0-web-sdk.yaml
  - path: patches/frontend-proxy-dash0-web.yaml
  - path: patches/collector-dynatrace-env.yaml
  - path: patches/collector-memory-increase.yaml
  # accounting-memory-increase.yaml consolidated into resource-limits.yaml
  - path: patches/grafana-resources.yaml
  - path: patches/grafana-config.yaml
  # Custom images for WillfulWaste retheme
  - path: patches/custom-images.yaml
# Scale down redundant backends - using Dash0 instead
# - path: patches/scale-down-prometheus.yaml  # RE-ENABLED: need Prometheus for local querying
# - path: patches/scale-down-jaeger.yaml  # REMOVED: jaeger removed from base
# - path: patches/scale-down-grafana.yaml  # REMOVED: grafana removed from base
# - path: patches/scale-down-opensearch.yaml  # REMOVED: opensearch removed from base

# Image overrides - DO NOT USE: all services share the same base image name
# so kustomize images[] replaces ALL of them with one image. Use patches instead.
images: []
