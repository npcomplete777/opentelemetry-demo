apiVersion: v1
kind: ConfigMap
metadata:
  name: dash0-web-proxy-config
data:
  nginx.conf: |
    events {
      worker_connections 64;
    }
    http {
      # DNS resolver for dynamic upstream (required for variable proxy_pass)
      resolver 10.43.0.10 valid=30s;

      server {
        listen 8090;

        # Health check
        location /healthz {
          return 200 'ok';
          add_header Content-Type text/plain;
        }

        # Proxy /v1/traces and /v1/logs to Dash0 ingress
        location /v1/ {
          # Use variable to force DNS resolution at runtime
          set $dash0_upstream https://ingress.us-west-2.aws.dash0.com;

          proxy_pass $dash0_upstream/v1/;
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_protocols TLSv1.2 TLSv1.3;
          proxy_set_header Host ingress.us-west-2.aws.dash0.com;
          proxy_set_header Authorization "Bearer auth_uG2giIHVL1Xf0fW8CRx8NLlJJS1s0uA1";
          proxy_set_header Content-Type $http_content_type;
          proxy_set_header Connection "";

          # Forward client IP for geo resolution
          proxy_set_header X-Forwarded-For $remote_addr;

          # Support large batched payloads from the SDK
          client_max_body_size 1m;

          # Handle CORS preflight (not needed for same-origin, but just in case)
          if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Dash0-Dataset';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash0-web-proxy
  labels:
    app.kubernetes.io/name: dash0-web-proxy
    app.kubernetes.io/component: dash0-web-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dash0-web-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dash0-web-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            limits:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: dash0-web-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: dash0-web-proxy
  labels:
    app.kubernetes.io/name: dash0-web-proxy
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      name: http
  selector:
    app.kubernetes.io/name: dash0-web-proxy
