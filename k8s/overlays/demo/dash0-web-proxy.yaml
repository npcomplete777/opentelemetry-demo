apiVersion: v1
kind: ConfigMap
metadata:
  name: dash0-web-proxy-config
data:
  nginx.conf.template: |
    events {
      worker_connections 64;
    }
    http {
      server {
        listen 8090;

        # Health check
        location /healthz {
          return 200 'ok';
          add_header Content-Type text/plain;
        }

        # Proxy /v1/traces and /v1/logs to Dash0 ingress
        location /v1/ {
          proxy_pass https://ingress.us-west-2.aws.dash0.com;
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_protocols TLSv1.2 TLSv1.3;
          proxy_set_header Host ingress.us-west-2.aws.dash0.com;
          proxy_set_header Authorization "Bearer ${DASH0_AUTH_TOKEN}";
          proxy_set_header Content-Type $http_content_type;
          proxy_set_header Connection "";
          proxy_set_header X-Forwarded-For $remote_addr;
          client_max_body_size 1m;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash0-web-proxy
  labels:
    app.kubernetes.io/name: dash0-web-proxy
    app.kubernetes.io/component: dash0-web-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dash0-web-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dash0-web-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          ports:
            - containerPort: 8090
          env:
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-auth-secret
                  key: token
            - name: NGINX_ENVSUBST_FILTER
              value: DASH0_AUTH_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates/nginx.conf.template
              subPath: nginx.conf.template
          resources:
            limits:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: dash0-web-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: dash0-web-proxy
  labels:
    app.kubernetes.io/name: dash0-web-proxy
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      name: http
  selector:
    app.kubernetes.io/name: dash0-web-proxy
