# Dash0 is not used for this evaluation (Dynatrace is the OTLP backend); this
# placeholder keeps kustomize/ArgoCD happy without committing a real token.
# If Dash0 is needed again, create the real secret manually in-cluster instead
# of committing it here (same convention as dynatrace-otel-secret).
apiVersion: v1
kind: Secret
metadata:
  name: dash0-auth-secret
type: Opaque
stringData:
  token: REPLACE_ME_MANUALLY_IN_CLUSTER
