---
# Synthetic checks for the OpenTelemetry Demo application.
# These are managed by the Dash0 Operator (Dash0SyntheticCheck CRD).
# URLs use in-cluster DNS — the operator runs inside the cluster.
# The frontend-proxy is also reachable externally via NodePort 30080.

# ── 1. Frontend (user-facing storefront) ────────────────────────────────────
apiVersion: operator.dash0.com/v1alpha1
kind: Dash0SyntheticCheck
metadata:
  name: frontend-homepage
  namespace: otel-demo
spec:
  display:
    name: "Frontend – Homepage"
  enabled: true
  labels:
    service: frontend
    tier: user-facing
  notifications:
    channels: []
  plugin:
    kind: http
    spec:
      request:
        method: get
        url: "http://frontend.otel-demo.svc.cluster.local:8080/"
        redirects: follow
        headers: []
        queryParameters: []
        tls:
          allowInsecure: false
        tracing:
          addTracingHeaders: true
      assertions:
        criticalAssertions:
          - kind: status_code
            spec:
              operator: is
              value: "200"
        degradedAssertions:
          - kind: timing
            spec:
              type: total
              operator: gte
              value: "2000"
  retries:
    kind: fixed
    spec:
      attempts: 2
      delay: 5s
  schedule:
    interval: 1m
    locations:
      - eu-west-1
    strategy: all_locations
---
