apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
    spec:
      containers:
        - name: otelcol
          # Same release as the upstream demo's .env (COLLECTOR_CONTRIB_IMAGE).
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.142.0
          args: ["--config=/conf/config.yaml"]
          envFrom:
            - secretRef:
                name: otel-gateway-secret
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          # Observed 2026-10-16: ~111 MiB RSS, ~7m CPU. The limit leaves room for
          # the exporters' retry queues (1000 requests each) if a backend is down.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
