# Source: opentelemetry-demo/templates/component.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad
  labels:
    helm.sh/chart: opentelemetry-demo-0.40.2
    
    opentelemetry.io/name: ad
    
    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/component: ad
    app.kubernetes.io/name: ad
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      opentelemetry.io/name: ad
  template:
    metadata:
      labels:
        
        opentelemetry.io/name: ad
        
        app.kubernetes.io/version: "2.2.0"
        app.kubernetes.io/component: ad
        app.kubernetes.io/name: ad
      annotations:
        resource.opentelemetry.io/service.namespace: otel-demo
    spec:
      serviceAccountName: otel-demo
      containers:
        - name: ad
          image: 'ghcr.io/open-telemetry/demo:2.2.0-ad'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8080
              name: service
          env:
            - name: AD_PORT
              value: "8080"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
          resources:
            limits:
              memory: 300Mi
          volumeMounts:
      volumes: