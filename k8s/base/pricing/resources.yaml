# Source: opentelemetry-demo/templates/component.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  labels:
    helm.sh/chart: opentelemetry-demo-0.40.2

    opentelemetry.io/name: pricing

    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/component: pricing
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:

      opentelemetry.io/name: pricing
  template:
    metadata:
      labels:

        opentelemetry.io/name: pricing

        app.kubernetes.io/version: "2.2.0"
        app.kubernetes.io/component: pricing
        app.kubernetes.io/name: pricing
      annotations:
        resource.opentelemetry.io/service.namespace: otel-demo
    spec:
      serviceAccountName: otel-demo
      containers:
        - name: pricing
          image: 'otel-demo-pricingservice:geometry-lab'
          imagePullPolicy: IfNotPresent
          ports:

            - containerPort: 8080
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: otel-collector
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: PRICING_PORT
              value: "8080"
            - name: PRODUCT_CATALOG_ADDR
              value: product-catalog:8080
            - name: CURRENCY_ADDR
              value: currency:8080
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: GOMEMLIMIT
              value: 16MiB
          resources:
            limits:
              memory: 20Mi
          volumeMounts:
      volumes:
