---
# Source: opentelemetry-demo/templates/component.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    helm.sh/chart: opentelemetry-demo-0.40.2

    opentelemetry.io/name: user

    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/component: user
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:

      opentelemetry.io/name: user
  template:
    metadata:
      labels:

        opentelemetry.io/name: user

        app.kubernetes.io/version: "2.2.0"
        app.kubernetes.io/component: user
        app.kubernetes.io/name: user
      annotations:
        resource.opentelemetry.io/service.namespace: otel-demo
    spec:
      serviceAccountName: otel-demo
      containers:
        - name: user
          image: 'otel-demo-userservice:geometry-lab'
          imagePullPolicy: IfNotPresent
          ports:

            - containerPort: 8080
              name: grpc
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: otel-collector
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: USER_PORT
              value: "8080"
            - name: ASPNETCORE_URLS
              value: "http://*:8080"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
          resources:
            limits:
              memory: 150Mi
