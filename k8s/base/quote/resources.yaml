# Source: opentelemetry-demo/templates/component.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote
  labels:
    helm.sh/chart: opentelemetry-demo-0.40.2
    
    opentelemetry.io/name: quote
    
    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/component: quote
    app.kubernetes.io/name: quote
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      opentelemetry.io/name: quote
  template:
    metadata:
      labels:
        
        opentelemetry.io/name: quote
        
        app.kubernetes.io/version: "2.2.0"
        app.kubernetes.io/component: quote
        app.kubernetes.io/name: quote
      annotations:
        resource.opentelemetry.io/service.namespace: otel-demo
    spec:
      serviceAccountName: otel-demo
      containers:
        - name: quote
          image: 'ghcr.io/open-telemetry/demo:2.2.0-quote'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8080
              name: service
          env:
            - name: QUOTE_PORT
              value: "8080"
            - name: IPV6_ENABLED
              value: "false"
          resources:
            limits:
              memory: 40Mi
          securityContext:
            runAsGroup: 33
            runAsNonRoot: true
            runAsUser: 33
          volumeMounts:
      volumes: